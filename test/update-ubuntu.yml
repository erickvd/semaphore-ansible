---
# playbook_update_ubuntu.yml

- name: Mise à jour des machines Ubuntu
  hosts: "{{ HOSTS | default([]) }}"
  become: true

  tasks:
    # ── Tâches communes aux deux groupes ──────────────────────────────────────
    - name: Mise à jour du cache apt
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Mise à jour de tous les paquets
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true
      register: apt_result
      async: 1800
      poll: 30

    - name: Vérification si un reboot est nécessaire
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    # ── Bloc spécifique aux serveurs ──────────────────────────────────────────
    - name: Tâches spécifiques aux serveurs
      when: "'ubuntu_servers' in group_names or 'proxmox_servers' in group_names"
      block:

#        - name: "[Serveurs] Afficher un avertissement si un reboot est nécessaire"
#          ansible.builtin.debug:
#            msg: >
#              ⚠️  REBOOT REQUIS sur {{ inventory_hostname }} !
#              Veuillez redémarrer manuellement dès que possible.
#          when: reboot_required.stat.exists

        - name: "[Serveurs] Afficher les paquets mis à jour"
          vars:
            paquets: "{{ apt_result.stdout_lines | select('match', '^Inst ') | map('regex_replace', '^Inst (\\S+).*', '\\1') | list }}"
            resume: "{{ apt_result.stdout_lines | select('match', '^\\d+ upgraded') | list | first | default('') }}"
          ansible.builtin.debug:
            msg:
              - "📦 Mise à jour sur {{ inventory_hostname }}"
              - "Paquets : {{ paquets | join(', ') }}"
              - "Résumé  : {{ resume }}"
          when: apt_result.changed
          # noqa: no-handler

    # ── Bloc spécifique aux desktops ──────────────────────────────────────────
    - name: Tâches spécifiques aux desktops
      when: "'ubuntu_desktops' in group_names"
      block:

        - name: "[Desktops] Vérification si snap est installé"
          ansible.builtin.command: which snap
          register: snap_check
          changed_when: false
          failed_when: false

        - name: "[Desktops] Mise à jour des snaps (si snap est installé)"
          community.general.snap:
            name: "*"
            state: present
          when: snap_check.rc == 0

        - name: "[Desktops] Lire les paquets nécessitant un reboot"
          ansible.builtin.slurp:
            src: /var/run/reboot-required.pkgs
          register: reboot_pkgs
          when: reboot_required.stat.exists

        - name: "[Desktops] Afficher les paquets mis à jour"
          vars:
            paquets: "{{ apt_result.stdout_lines | select('match', '^Inst ') | map('regex_replace', '^Inst (\\S+).*', '\\1') | list }}"
            resume: "{{ apt_result.stdout_lines | select('match', '^\\d+ upgraded') | list | first | default('') }}"
          ansible.builtin.debug:
            msg:
              - "📦 Mise à jour sur {{ inventory_hostname }}"
              - "Paquets : {{ paquets | join(', ') }}"
              - "Résumé  : {{ resume }}"
          when: apt_result.changed
          # noqa: no-handler

    - name: "Afficher un avertissement si un reboot est nécessaire"
      ansible.builtin.debug:
        msg: >
          ⚠️  REBOOT REQUIS sur {{ inventory_hostname }} !
          Paquets concernés : {{ reboot_pkgs.stdout_lines | default(['inconnu']) }}
      when: reboot_required.stat.exists
